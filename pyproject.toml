[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-discover"
version = "0.3.0"
description = "A network discovery tool that identifies SSH, SNMP, and MySQL services on network devices"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Thomas Vincent", email = "thomasvincent@gmail.com"}
]
keywords = ["network", "sysadmin", "discovery", "snmp", "ssh", "mysql", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.5.0",
    "snimpy>=1.1.0",
    "mysqlclient>=2.2.0",
    "openpyxl>=3.1.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "types-paramiko>=3.5.0",
]

[project.scripts]
network-discover = "discovery:main"

[project.urls]
Homepage = "https://github.com/thomasvincent/python-auto-discover-network-Device-Management"
Repository = "https://github.com/thomasvincent/python-auto-discover-network-Device-Management"
Issues = "https://github.com/thomasvincent/python-auto-discover-network-Device-Management/issues"

[tool.setuptools.packages.find]
exclude = ["tests", "docs"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["devices", "database", "discovery", "mail", "spreadsheet"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "snimpy.*",
    "MySQLdb.*",
    "paramiko.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
