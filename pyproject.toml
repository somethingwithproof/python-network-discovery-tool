[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netprobe"
version = "3.0.0"
description = "Network service discovery with fingerprinting, inventory diffs and Kadupul export"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Thomas Vincent", email = "thomasvincent@gmail.com"},
]
keywords = ["network", "scanner", "nmap", "discovery", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]

dependencies = [
    "cryptography>=46.0.0",
    "pysnmp>=7.1.0",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
fuzz = [
    "atheris>=3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
nmap = [
    "python-nmap>=0.7.1",
]
dev = [
    "python-nmap>=0.7.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "mypy>=1.19.1",
    "hatchling>=1.27.0",
    "installer>=0.7.0",
    "bandit>=1.8.0",
    "twine>=6.2.0",
]

[dependency-groups]
build = ["hatchling>=1.27.0", "setuptools>=80.9.0", "wheel>=0.46.0"]

[project.scripts]
netprobe = "netprobe.cli:app"

[project.urls]
Homepage = "https://github.com/somethingwithproof/python-network-discovery-tool"
Repository = "https://github.com/somethingwithproof/python-network-discovery-tool"
Issues = "https://github.com/somethingwithproof/python-network-discovery-tool/issues"

[tool.ruff]
# Modern all-in-one linter (replaces black, isort, flake8, pylint)
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default arg (typer pattern)
    "N999",   # invalid module name (directory name, not changeable)
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/netprobe", "scripts/release.py"]

[[tool.mypy.overrides]]
# python-nmap and pysnmp ship no type information.
module = ["nmap", "pysnmp.*"]
ignore_missing_imports = true

[tool.ruff.format]
# Use ruff as formatter (replaces black)
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "integration: scans the docker compose lab (tests/integration/compose.yml)",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["netprobe"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netprobe"]

[tool.hatch.build.targets.sdist]
include = ["src/netprobe", "tests", "README.md", "pyproject.toml", "netprobe.example.toml", "uv.lock", "scripts/release.py", "docs/releasing.md"]

[tool.bandit]
# pytest relies on bare asserts.
exclude_dirs = ["tests"]
