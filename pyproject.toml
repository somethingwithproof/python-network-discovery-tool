[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-discovery"
version = "1.0.0"
description = "A Python network discovery tool for scanning and monitoring network devices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Thomas Vincent", email = "thomasvincent@users.noreply.github.com"},
]
keywords = ["network", "discovery", "scanner", "nmap", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "python-nmap>=0.7.1",
    "paramiko>=3.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
    "ijson>=3.2.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-PyYAML>=6.0.0",
    "types-paramiko>=3.0.0",
]
mysql = [
    "pymysql>=1.1.0",
]
postgres = [
    "pg8000>=1.30.0",
]
snmp = [
    "snimpy>=1.0.0",
    "pysnmp>=6.0.0",
]
redis = [
    "redis>=5.0.0",
]
dns = [
    "dnspython>=2.4.0",
]
pdf = [
    "fpdf2>=2.7.0",
]
all = [
    "network-discovery[mysql,postgres,snmp,redis,dns,pdf]",
]

[project.scripts]
network-discovery = "network_discovery.interfaces.cli:cli"

[project.urls]
Homepage = "https://github.com/thomasvincent/python-network-discovery-tool"
Repository = "https://github.com/thomasvincent/python-network-discovery-tool"
Issues = "https://github.com/thomasvincent/python-network-discovery-tool/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Ruff - Modern Python linter and formatter (replaces Black, isort, flake8, pyupgrade)
# https://docs.astral.sh/ruff/
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "PLC0415"]
"scripts/*" = ["PTH123"]
"src/network_discovery/interfaces/cli.py" = ["B008", "PLR0912"]

[tool.ruff.lint.isort]
known-first-party = ["network_discovery"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy - Static type checker
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "nmap.*",
    "paramiko.*",
    "snimpy.*",
    "pymysql.*",
    "redis.*",
    "pysnmp.*",
    "uvicorn.*",
]
ignore_missing_imports = true

# Pytest - Testing framework
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=network_discovery",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage - Code coverage reporting
[tool.coverage.run]
source = ["src/network_discovery"]
branch = true
parallel = true
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "@abstractmethod",
]
fail_under = 50
show_missing = true
precision = 2

[tool.coverage.paths]
source = ["src/network_discovery"]

# Bandit - Security linter
[tool.bandit]
exclude_dirs = ["tests", ".tox", ".venv", "venv"]
skips = ["B101", "B104", "B110", "B112", "B601"]
