services:
  # Production service for running network discovery
  network-discovery:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    volumes:
      - ./output:/app/output
      - ./templates:/app/templates:ro
      - ~/.ssh:/home/appuser/.ssh:ro
    environment:
      SSH_USER: ${SSH_USER:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - discovery-net
    depends_on:
      redis:
        condition: service_healthy
    # Override with: docker compose run network-discovery 192.168.1.0/24
    command: ["--help"]

  # Development environment with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - dev-venv:/app/.venv
      - ~/.ssh:/root/.ssh:ro
      - dev-cache:/root/.cache
    environment:
      SSH_USER: ${SSH_USER:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONDONTWRITEBYTECODE: 1
    networks:
      - discovery-net
    depends_on:
      - redis
    stdin_open: true
    tty: true
    # Run with: docker compose run dev

  # Test runner service
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - test-venv:/app/.venv
      - test-cache:/root/.cache
    environment:
      PYTHONPATH: /app/src
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - discovery-net
    depends_on:
      redis:
        condition: service_healthy
    command: ["sh", "-c", "uv sync --extra dev --extra mysql --extra redis --extra pdf && uv run pytest -xvs tests/"]

  # Redis for repository storage and testing
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - discovery-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # API server for web interface
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./templates:/app/templates:ro
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - discovery-net
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["uvicorn"]
    command: ["network_discovery.interfaces.api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  discovery-net:
    driver: bridge

volumes:
  redis-data:
  dev-cache:
  dev-venv:
  test-cache:
  test-venv:
