# Lab network for integration tests. Everything stays on a private bridge;
# the tester container scans only this subnet.
name: hostcensus-it

services:
  ssh:
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache openssh-server && ssh-keygen -A
        CMD ["/usr/sbin/sshd", "-D", "-e"]
    networks:
      lab:
        ipv4_address: 172.30.57.10
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 30

  db:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    networks:
      lab:
        ipv4_address: 172.30.57.11
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 2s
      retries: 60

  snmp:
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache net-snmp net-snmp-tools
        COPY <<'CONF' /etc/snmp/snmpd.conf
        agentaddress udp:161
        rocommunity hostcensus-test default
        createUser hostcensus SHA "hostcensus-auth" AES "hostcensus-priv"
        rouser hostcensus priv
        sysname snmp-lab
        syslocation hostcensus integration lab
        CONF
        CMD ["snmpd", "-f", "-Lo", "-C", "-c", "/etc/snmp/snmpd.conf"]
    networks:
      lab:
        ipv4_address: 172.30.57.12
    healthcheck:
      test: ["CMD", "snmpget", "-v2c", "-c", "hostcensus-test", "127.0.0.1", "1.3.6.1.2.1.1.5.0"]
      interval: 2s
      retries: 30

  web:
    build:
      dockerfile_inline: |
        FROM nginx:1.28-alpine
        RUN apk add --no-cache openssl && openssl req -x509 -newkey ec \
            -pkeyopt ec_paramgen_curve:P-256 -nodes -days 30 \
            -subj "/O=hostcensus lab/CN=web.lab" \
            -addext "subjectAltName=DNS:web.lab,IP:172.30.57.13" \
            -keyout /etc/nginx/lab.key -out /etc/nginx/lab.crt
        COPY <<'CONF' /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            listen 443 ssl;
            ssl_certificate /etc/nginx/lab.crt;
            ssl_certificate_key /etc/nginx/lab.key;
            location / { return 200 "lab\n"; }
        }
        CONF
    networks:
      lab:
        ipv4_address: 172.30.57.13
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      retries: 30

  quiet:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    networks:
      lab:
        ipv4_address: 172.30.57.14

  # Runs the test suite from inside the lab so container IPs are reachable
  # on any Docker host, including Docker Desktop.
  tester:
    profiles: [tester]
    build:
      context: ../..
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY --from=ghcr.io/astral-sh/uv:0.12.23@sha256:61d393e44e249f2e4b526b6c7ddcecce245946826e608e11c93ad4f5bba55b21 /uv /usr/local/bin/uv
        RUN apt-get update && apt-get install -y --no-install-recommends nmap \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /src
        COPY pyproject.toml uv.lock README.md ./
        COPY src ./src
        # The source tree is mounted at /src, so the environment lives outside
        # it. The installed copy supplies package metadata; PYTHONPATH below
        # makes the mounted sources the code under test.
        ENV UV_PROJECT_ENVIRONMENT=/opt/venv UV_PYTHON_DOWNLOADS=never
        RUN uv sync --locked --extra nmap --no-editable
        ENV PATH="/opt/venv/bin:$PATH"
    environment:
      PYTHONPATH: /src/src
      PYTHONDONTWRITEBYTECODE: "1"
      HOSTCENSUS_LAB: "1"
    volumes:
      - ../..:/src
    working_dir: /src
    networks:
      lab:
        ipv4_address: 172.30.57.2
    depends_on:
      ssh: {condition: service_healthy}
      db: {condition: service_healthy}
      snmp: {condition: service_healthy}
      web: {condition: service_healthy}
      quiet: {condition: service_started}

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.57.0/24
