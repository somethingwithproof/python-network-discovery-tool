version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, github_actions]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # uv owns pyproject.toml and uv.lock; pip would not maintain this lockfile.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      python-tooling:
        patterns: [atheris, bandit, hatchling, installer, mypy, "pytest*", ruff, setuptools, twine, wheel]
        update-types: [minor, patch]
      python-runtime:
        patterns: ["*"]
        exclude-patterns: [atheris, bandit, hatchling, installer, mypy, "pytest*", ruff, setuptools, twine, wheel]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
    # Runtime/base image changes receive maintainer review, including digest bumps.
