changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, bugfix]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Maintenance
      labels: ["*"]
