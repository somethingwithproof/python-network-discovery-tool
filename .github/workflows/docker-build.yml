name: Docker Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        load: true
        tags: network-discovery:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm network-discovery:test --help

    - name: Run tests and lint in Docker
      run: |
        docker run --rm -v "${{ github.workspace }}:/src" -w /src --entrypoint bash network-discovery:test -c "pip install --no-cache-dir '.[dev]' && pytest -v && ruff check . && ruff format --check ."
