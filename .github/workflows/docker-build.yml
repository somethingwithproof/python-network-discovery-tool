name: Docker Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        push: false
        load: true
        tags: network-discovery:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm network-discovery:test --help

    - name: Validate the installed container package
      run: |
        docker run --rm --entrypoint python network-discovery:test -c "from netprobe.cli import app; from netprobe.scanner import NetworkScanner; import defusedxml.ElementTree, shutil; assert shutil.which('nmap'); print('installed package, XML parser and nmap available')"

    - name: Check the runtime hardening
      run: |
        test "$(docker image inspect --format '{{.Config.User}}' network-discovery:test)" = "10001:10001"
        docker run --rm --entrypoint python network-discovery:test -c "import importlib.util as u, os, shutil; assert os.getuid() == 10001; assert u.find_spec('pip') is None; assert shutil.which('pip') is None; print('non-root, no pip')"
        # A read-only root filesystem must be enough for a scan of loopback.
        docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
          --tmpfs /tmp --entrypoint sh network-discovery:test -c \
          'netprobe scan 127.0.0.1 --services ssh -q -o /tmp/report.json && python -c "import json; json.load(open(\"/tmp/report.json\"))"'

    - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: network-discovery:test
        version: v0.76.2
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        format: table
