name: Parser fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "35 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Offline parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install locked wheel-only fuzz dependencies
        run: uv sync --locked --group fuzz --no-build --no-install-project
      - name: Build and install the project wheel
        run: |
          uv build --no-build-isolation --wheel
          .venv/bin/python -m installer dist/*.whl
      - name: Fuzz bounded protocol parsers offline
        run: uv run --locked --no-sync --no-build python fuzz/fuzz_parsers.py -max_total_time=60 -max_len=4096 -timeout=5
