name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A squash merge commits the PR title to main, and release-please derives
      # the next version and changelog from it.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ](.*[^ ])?$'
          if printf '%s\n' "$TITLE" | grep -Eqx -- "$pattern"; then
            echo "Title follows Conventional Commits."
          else
            echo "::error title=PR title::Use a Conventional Commit title such as 'fix(scan): ...' or 'feat!: ...'; see docs/releasing.md."
            exit 1
          fi
