name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens or updates the release PR from Conventional Commits on main. Merging
      # that PR creates the vX.Y.Z tag and a draft release; nothing is published.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with GITHUB_TOKEN do not start CI, so the release
          # PR's required checks only run when RELEASE_PLEASE_TOKEN (a GitHub App
          # or fine-grained token with contents and pull-requests write) is set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build, attest and attach release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # release.yml has no tag-push trigger; this call is the only automatic build.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
