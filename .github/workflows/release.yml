name: Release

# No tag-push trigger: release-please calls this workflow for the tags it creates,
# and a tag-push trigger would start a second build whenever RELEASE_PLEASE_TOKEN
# lets that tag start workflows. Build a hand-pushed tag with workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v3.1.0 or v3.2.0-rc.1"
        required: true
        type: string
  # Called by release-please.yml after it creates the tag and draft release.
  workflow_call:
    inputs:
      tag:
        description: "Release tag created by release-please"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/release-please.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "scripts/release.py"
      - "tests/test_release.py"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGES.md"
      - "README.md"

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

concurrency:
  # One build per tag, however it was started.
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install locked build and test tools
        # Nmap tests use the mocked adapter; its optional source-only wrapper is
        # tested separately by CI. Release dependency installation is wheel-only.
        run: uv sync --locked --no-build --no-install-project
      - name: Validate version, notes, and release source
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git show "$BASE_SHA:pyproject.toml" > "$RUNNER_TEMP/base-project.toml"
            previous=$(python -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$RUNNER_TEMP/base-project.toml")
            args+=(--previous-version "$previous")
          else
            git show-ref --verify "refs/tags/$RELEASE_TAG"
            git merge-base --is-ancestor HEAD origin/main
            # Only a release has notes; a pull request may be between releases.
            args+=(--tag "$RELEASE_TAG" --notes release-notes.md)
          fi
          python scripts/release.py check "${args[@]}" > release-metadata.json
          jq -r '"tag=" + .tag, "prerelease=" + (.prerelease | tostring)' release-metadata.json >> "$GITHUB_OUTPUT"
      - name: Build once and install the release wheel for testing
        run: |
          uv build --no-build-isolation
          .venv/bin/python -m installer dist/*.whl
      - name: Run quality and regression checks
        run: |
          uv run --locked --no-sync --no-build ruff check .
          uv run --locked --no-sync --no-build ruff format --check .
          uv run --locked --no-sync --no-build mypy
          uv run --locked --no-sync --no-build pytest --cov=hostcensus --cov-fail-under=90
      - name: Validate the tested package contents
        run: |
          uv run --locked --no-sync --no-build twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/release.py check --dist dist --checksums dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            release-notes.md
            release-metadata.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest release artifacts
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (!github.event.repository.private || vars.ARTIFACT_ATTESTATIONS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-distributions
          path: artifacts
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "artifacts/dist/*"

  draft:
    name: Create draft GitHub release
    needs: [build, attest]
    if: >-
      always() && github.event_name != 'pull_request' && needs.build.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-distributions
          path: artifacts
      - name: Create release with the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # release-please has already created an empty draft for its tag; attach
          # the tested files and the validated CHANGES.md section to it. Never
          # touch a published release or replace assets: corrections get a new
          # version.
          if gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != "true" ] ||
               [ "$(jq '.assets | length' "$RUNNER_TEMP/release.json")" != "0" ]; then
              echo "Release $RELEASE_TAG is published or already has assets; refusing to change it."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" artifacts/dist/*.whl artifacts/dist/*.tar.gz artifacts/dist/SHA256SUMS
            gh release edit "$RELEASE_TAG" --notes-file artifacts/release-notes.md
            exit 0
          fi
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/dist/*.whl artifacts/dist/*.tar.gz artifacts/dist/SHA256SUMS \
            --repo "$GH_REPO" --verify-tag --draft --latest=false --title "$RELEASE_TAG" \
            --notes-file artifacts/release-notes.md "${args[@]}"
