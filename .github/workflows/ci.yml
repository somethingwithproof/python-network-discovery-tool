name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          tool_versions: |
            python 3.12
            uv 0.12.23
      - name: Install wheel-only locked test dependencies
        run: uv sync --locked --extra dev --no-build --no-install-project --no-install-package python-nmap
      - name: Build and install the project wheel
        run: |
          uv build --no-build-isolation --wheel
          .venv/bin/python -m installer dist/*.whl
      - run: uv run --locked --no-sync --no-build ruff check .
      - run: uv run --locked --no-sync --no-build ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          tool_versions: |
            python ${{ matrix.python-version }}
            uv 0.12.23
      - name: Install wheel-only locked test dependencies
        run: uv sync --locked --extra dev --no-build --no-install-project --no-install-package python-nmap
      - name: Build and install the project wheel
        run: |
          uv build --no-build-isolation --wheel
          .venv/bin/python -m installer dist/*.whl
      - run: uv run --locked --no-sync --no-build pytest -v --cov=netprobe --cov-report=xml --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration (compose lab)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Run tests inside the lab network
        run: >-
          docker compose -f tests/integration/compose.yml --profile tester
          run --rm --build tester pytest -m integration -v -p no:cacheprovider
      - name: Tear down the lab
        if: always()
        run: docker compose -f tests/integration/compose.yml --profile tester down -v

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          tool_versions: |
            python 3.12
            uv 0.12.23
      - name: Install wheel-only locked test dependencies
        run: uv sync --locked --extra dev --no-build --no-install-project --no-install-package python-nmap
      - name: Build and install the project wheel
        run: |
          uv build --no-build-isolation --wheel
          .venv/bin/python -m installer dist/*.whl
      - run: uv run --locked --no-sync --no-build mypy
